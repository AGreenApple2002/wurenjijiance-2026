# YOLO26 自定义结构：可学习双边下采样（LBDown）+ 粗粒度块注意力（CGBlockAttn）
# 用途：无人机航拍小目标 / 中远距目标检测（在 DroneVehicle 上微调）
#
# 相对官方 yolo26.yaml 的改动：
#   1) backbone 前两级 stride-2 卷积下采样 -> LBDown（双边加权，减少小目标响应被平均掉）
#   2) backbone P3 / P4 级各插入一个 CGBlockAttn（块级粗粒度注意力，低成本长程上下文）
#   3) head 中所有 Concat 的 from 索引随新增层顺延
#
# 基线对照请直接用官方 ultralytics/cfg/models/26/yolo26.yaml（同 scales、同训练超参）。

# Parameters
nc: 80 # number of classes
end2end: True # whether to use end-to-end mode
reg_max: 1 # DFL bins
scales: # model compound scaling constants
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]

# YOLO26n backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, LBDown, [64]] # 0-P1/2（替换 Conv [64, 3, 2]）
  - [-1, 1, LBDown, [128]] # 1-P2/4（替换 Conv [128, 3, 2]）
  - [-1, 2, C3k2, [256, False, 0.25]] # 2
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 4
  - [-1, 1, CGBlockAttn, [512, 8, 4]] # 5（新增：P3 级粗粒度块注意力）
  - [-1, 1, Conv, [512, 3, 2]] # 6-P4/16
  - [-1, 2, C3k2, [512, True]] # 7
  - [-1, 1, CGBlockAttn, [512, 8, 4]] # 8（新增：P4 级粗粒度块注意力）
  - [-1, 1, Conv, [1024, 3, 2]] # 9-P5/32
  - [-1, 2, C3k2, [1024, True]] # 10
  - [-1, 1, SPPF, [1024, 5, 3, True]] # 11
  - [-1, 2, C2PSA, [1024]] # 12

# YOLO26n head
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 13
  - [[-1, 8], 1, Concat, [1]] # 14 cat backbone P4（原 [6]）
  - [-1, 2, C3k2, [512, True]] # 15

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 16
  - [[-1, 5], 1, Concat, [1]] # 17 cat backbone P3（原 [4]）
  - [-1, 2, C3k2, [256, True]] # 18 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]] # 19
  - [[-1, 15], 1, Concat, [1]] # 20 cat head P4（原 [13]）
  - [-1, 2, C3k2, [512, True]] # 21 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]] # 22
  - [[-1, 12], 1, Concat, [1]] # 23 cat head P5（原 [10]）
  - [-1, 1, C3k2, [1024, True, 0.5, True]] # 24 (P5/32-large)

  - [[18, 21, 24], 1, Detect, [nc]] # 25 Detect(P3, P4, P5)
